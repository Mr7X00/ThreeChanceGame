<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Nodes -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="16 8" opacity="0.8" />
  <circle cx="100" cy="100" r="76" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />

  <!-- Hexagonal Core Accent -->
  <polygon points="100,38 152,68 152,132 100,162 48,132 48,68" fill="#111827" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- 3 Glowing Chance Nodes / Orbs -->
  <!-- Chance 1: Top Left -->
  <circle cx="70" cy="78" r="10" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="70" cy="78" r="5" fill="#ffffff" />
  
  <!-- Chance 2: Top Right -->
  <circle cx="130" cy="78" r="10" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="130" cy="78" r="5" fill="#ffffff" />

  <!-- Chance 3: Bottom Center -->
  <circle cx="100" cy="130" r="10" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="100" cy="130" r="5" fill="#ffffff" />

  <!-- Center '3' Symbol -->
  <text x="100" y="106" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">3</text>

  <!-- Crosshair Accents -->
  <line x1="100" y1="20" x2="100" y2="32" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="100" y1="168" x2="100" y2="180" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="100" x2="32" y2="100" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="168" y1="100" x2="180" y2="100" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />
</svg>
